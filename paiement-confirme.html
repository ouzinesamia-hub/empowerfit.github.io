<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#5F123F">
  <title>Paiement confirmé · EMPOWERFIT</title>
  <style>
    :root{--p:#5F123F;--b:#F7F1E5;--i:#1d1017;--ok:#237a57;--mut:#756b70}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--b);color:var(--i);font-family:Inter,system-ui,sans-serif;padding:20px}.card{width:min(580px,100%);background:#fff;border-radius:24px;padding:34px;box-shadow:0 18px 60px #3a172122;text-align:center;border:1px solid #5f123f12}.check{width:64px;height:64px;border-radius:50%;margin:auto;display:grid;place-items:center;background:#edf8f2;color:var(--ok);font-size:2rem;font-weight:900}h1{font-family:Georgia,serif;color:var(--p);font-size:clamp(2rem,7vw,3rem);margin:.55em 0 .35em}p{color:var(--mut);line-height:1.65}.btn{display:block;margin-top:22px;padding:14px 18px;border-radius:13px;background:var(--p);color:#fff;text-decoration:none;font-weight:850}.fine{font-size:.8rem}
  </style>
</head>
<body>
  <main class="card">
    <div class="check">✓</div>
    <h1>Paiement confirmé</h1>
    <p>Votre achat EMPOWERFIT a bien été enregistré. Vos droits d’accès sont activés automatiquement avec l’adresse e-mail utilisée lors du paiement.</p>
    <p class="fine">Utilisez exactement cette même adresse e-mail pour réserver votre cours ou votre bilan.</p>
    <a class="btn" href="reservation.html">Choisir mon créneau</a>
  </main>
</body>
</html>
