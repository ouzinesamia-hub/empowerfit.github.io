<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5F123F">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Préparer mon bilan · EMPOWERFIT</title>
  <style>
    :root{--plum:#5f123f;--plum-dark:#351027;--plum-soft:#7b315f;--gold:#c7a35a;--cream:#f8f3ef;--blush:#eedfe7;--ink:#29242a;--muted:#756b72;--white:#fff;--ok:#237a57;--error:#a22;--shadow:0 22px 60px rgba(53,16,39,.14)}
    *{box-sizing:border-box}
    html{background:var(--cream)}
    body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 100% 0,rgba(199,163,90,.18),transparent 32rem),var(--cream);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}
    button{touch-action:manipulation}
    .topbar{height:8px;background:linear-gradient(90deg,var(--plum-dark),var(--plum),var(--gold))}
    .shell{width:min(100%,760px);margin:auto;padding:22px 18px calc(38px + env(safe-area-inset-bottom))}
    .brand{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
    .brand strong{color:var(--plum);font-size:1.05rem;letter-spacing:.14em}
    .brand span{color:var(--muted);font-size:.78rem;text-align:right}
    .card{background:rgba(255,255,255,.94);border:1px solid rgba(95,18,63,.11);border-radius:25px;box-shadow:var(--shadow);overflow:hidden}
    .card-body{padding:clamp(24px,5vw,44px)}
    .eyebrow{color:var(--plum-soft);font-size:.76rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
    h1{margin:.55rem 0 1rem;color:var(--plum-dark);font-size:clamp(2rem,7vw,3.25rem);line-height:1.02;letter-spacing:-.04em}
    h2{margin:.5rem 0 1rem;color:var(--plum-dark);font-size:clamp(1.55rem,5vw,2.25rem);line-height:1.12;letter-spacing:-.025em}
    p{line-height:1.62}
    .lead{font-size:1.04rem;color:#4d4249}
    .appointment{margin:22px 0;padding:16px 18px;border-left:4px solid var(--gold);border-radius:0 13px 13px 0;background:var(--cream)}
    .appointment b{display:block;color:var(--plum);margin-bottom:4px}
    .micro{font-size:.84rem;color:var(--muted)}
    .progress-wrap{padding:18px 24px 0}
    .progress-meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.78rem;font-weight:700}
    .track{height:7px;margin-top:10px;border-radius:99px;background:#eadfe5;overflow:hidden}
    .bar{height:100%;width:0;background:linear-gradient(90deg,var(--plum),var(--gold));transition:width .28s ease}
    .question-number{margin-top:2px;color:var(--plum-soft);font-size:.82rem;font-weight:800}
    .question-note{margin:-.2rem 0 1.25rem;color:var(--muted);font-size:.88rem;line-height:1.45}
    .options{display:grid;gap:10px;margin-top:22px}
    .option{width:100%;min-height:52px;padding:13px 15px;border:1.5px solid #ddcfd7;border-radius:14px;background:#fff;color:var(--ink);text-align:left;cursor:pointer;transition:border-color .15s,background .15s,transform .15s;display:flex;align-items:center;gap:12px}
    .option:hover{border-color:var(--plum-soft)}
    .option:active{transform:scale(.992)}
    .option::before{content:"";width:20px;height:20px;flex:0 0 20px;border:2px solid #c8b5c0;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 4px #fff}
    .multiple .option::before{border-radius:6px}
    .option.selected{border-color:var(--plum);background:#f8edf3;color:var(--plum-dark);font-weight:750}
    .option.selected::before{border-color:var(--plum);background:var(--plum)}
    .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:24px}
    .scale .option{min-height:52px;justify-content:center;padding:8px;text-align:center}
    .scale .option::before{display:none}
    .scale-ends{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:.76rem}
    .other-wrap{margin-top:12px}
    .other-wrap label{display:block;margin-bottom:7px;color:var(--plum-dark);font-weight:750;font-size:.88rem}
    .other-wrap input{width:100%;min-height:50px;padding:12px 14px;border:1.5px solid #ccb9c4;border-radius:12px;background:#fff;color:var(--ink)}
    .other-wrap input:focus{outline:3px solid rgba(199,163,90,.25);border-color:var(--plum)}
    .subquestion{margin-top:24px;padding-top:22px;border-top:1px solid #e7dce2}
    .subquestion h3{margin:0 0 11px;color:var(--plum-dark);font-size:1rem}
    .actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:30px}
    .btn{min-height:52px;padding:13px 22px;border:0;border-radius:14px;background:var(--plum);color:#fff;font-weight:850;letter-spacing:.02em;cursor:pointer;box-shadow:0 10px 24px rgba(95,18,63,.19)}
    .btn:hover{background:var(--plum-dark)}
    .btn.secondary{background:transparent;color:var(--plum);box-shadow:none;border:1px solid #d9c9d2}
    .btn.wide{width:100%}
    .btn:disabled{opacity:.55;cursor:wait}
    .error{min-height:21px;margin:14px 0 0;color:var(--error);font-size:.88rem;font-weight:700}
    .consents{display:grid;gap:13px;margin:22px 0}
    .consent{display:flex;align-items:flex-start;gap:12px;padding:15px;border:1px solid #e0d2d9;border-radius:14px;background:#fff;line-height:1.42;cursor:pointer}
    .consent input{width:21px;height:21px;flex:0 0 auto;margin:1px 0 0;accent-color:var(--plum)}
    .consent.optional{background:var(--cream)}
    .consent-note{display:block;margin-top:5px;color:var(--muted);font-size:.78rem;line-height:1.4;font-weight:500}
    .success-mark{width:68px;height:68px;display:grid;place-items:center;border-radius:50%;background:var(--plum);color:#fff;font-size:2rem;box-shadow:0 10px 30px rgba(95,18,63,.23)}
    .completion-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px}
    .samia-avatar{width:92px;height:92px;flex:0 0 92px;border-radius:50%;object-fit:cover;object-position:center 38%;border:4px solid var(--gold);box-shadow:0 10px 26px rgba(53,16,39,.16)}
    .revolution{margin-top:26px;padding:22px;border-radius:17px;background:linear-gradient(135deg,var(--plum-dark),var(--plum));color:#fff}
    .revolution strong{color:#f2dcae}
    .revolution p{margin:9px 0 0;color:#fff}
    .revolution-link{color:#f2dcae;font-weight:850;text-decoration:underline;text-underline-offset:3px}
    .loading{text-align:center;padding:62px 30px;color:var(--muted)}
    .spinner{width:34px;height:34px;margin:0 auto 18px;border:3px solid #eadce4;border-top-color:var(--plum);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width:520px){.shell{padding-left:12px;padding-right:12px}.brand{padding:0 7px}.card{border-radius:21px}.card-body{padding:24px 20px}.progress-wrap{padding:16px 20px 0}.actions{align-items:stretch}.actions .btn{padding-left:15px;padding-right:15px}.scale{grid-template-columns:repeat(5,1fr);gap:6px}.scale .option{min-height:46px}.brand span{max-width:145px}.samia-avatar{width:82px;height:82px;flex-basis:82px}}
  </style>
</head>
